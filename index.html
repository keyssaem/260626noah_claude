<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 전학생 노아 — 공존·상생 프로젝트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Jua',sans-serif;color:#fff;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#1a1440 0%,#0a0a1a 70%,#050510 100%);
  height:100vh;
}
.screen{
  position:fixed;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;
}
.screen.on{display:flex;animation:fade .5s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* floating deco */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco span{position:absolute;display:block;border-radius:6px;opacity:.22;
  animation:floaty linear infinite}
@keyframes floaty{
  0%{transform:translateY(0) rotate(0)}
  100%{transform:translateY(-140px) rotate(180deg)}
}

/* ── INTRO ── */
#intro{background:#000;padding:0}
#intro video{width:100%;height:100%;object-fit:cover}
.skip{
  position:absolute;top:22px;right:22px;z-index:5;
  background:rgba(0,0,0,.5);border:1px solid #556;border-radius:20px;
  color:#fff;font-family:'Jua',sans-serif;font-size:.95rem;
  padding:8px 20px;cursor:pointer;
}
.skip:hover{background:rgba(0,0,0,.8)}

/* ── MENU ── */
.badge{
  background:rgba(124,109,240,.18);border:1px solid #7c6df0;border-radius:20px;
  padding:6px 18px;font-size:.85rem;color:#c4bbff;margin-bottom:22px;
}
.title{text-align:center;line-height:1.25;margin-bottom:14px;z-index:1}
.title span{display:block}
.title .t1{font-size:1.6rem;color:#e8eaf0}
.title .t2{font-size:3.1rem;color:#a78bfa;text-shadow:0 0 30px rgba(124,109,240,.6);margin:2px 0}
.title .t3{font-size:1.6rem;color:#e8eaf0}
.title .t4{font-size:2.1rem;color:#f07caa;margin-top:4px}
.subtitle{color:#9aa0ad;font-size:1rem;margin-bottom:38px;z-index:1}
.btn{
  font-family:'Jua',sans-serif;border:none;border-radius:30px;cursor:pointer;
  transition:transform .16s,box-shadow .16s;
}
.btn-primary{
  background:linear-gradient(135deg,#6d28d9,#4f46e5);color:#fff;
  font-size:1.25rem;padding:16px 54px;box-shadow:0 6px 24px rgba(99,102,241,.4);
}
.btn-primary:hover{transform:scale(1.05);box-shadow:0 8px 32px rgba(124,109,240,.7)}
.btn-ghost{
  background:transparent;border:2px solid #475569;color:#cbd5e1;
  font-size:.95rem;padding:11px 28px;margin-top:14px;
}
.btn-ghost:hover{border-color:#7c6df0;color:#fff}
.foot-note{position:absolute;bottom:26px;color:#556;font-size:.8rem;z-index:1}

/* ── PROFILE ── */
.card{
  background:rgba(20,24,40,.92);border:2px solid #3a3f5b;border-radius:24px;
  padding:38px 34px;width:min(440px,92vw);z-index:1;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.avatar{
  width:88px;height:88px;margin:0 auto 16px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#7c6df0,#4f46e5);
  display:flex;align-items:center;justify-content:center;font-size:2.6rem;
  box-shadow:0 0 30px rgba(124,109,240,.5);animation:bob 2.6s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bubble{
  background:rgba(124,109,240,.14);border-radius:14px;padding:14px 18px;
  text-align:center;font-size:1.05rem;line-height:1.6;margin-bottom:24px;color:#e8eaf0;
}
.field{margin-bottom:22px}
.field label{display:block;font-size:.9rem;color:#9aa0ad;margin-bottom:8px}
.field input{
  width:100%;background:#0f1120;border:2px solid #3a3f5b;border-radius:12px;
  color:#fff;font-family:'Jua',sans-serif;font-size:1.1rem;padding:13px 16px;outline:none;
}
.field input:focus{border-color:#7c6df0}
.gender{display:flex;gap:12px}
.gender button{
  flex:1;background:#0f1120;border:2px solid #3a3f5b;border-radius:12px;
  color:#9aa0ad;font-family:'Jua',sans-serif;font-size:1.05rem;padding:13px;cursor:pointer;
  transition:.15s;
}
.gender button.on{border-color:#7c6df0;background:rgba(124,109,240,.2);color:#fff}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.card .btn-primary{width:100%;font-size:1.15rem;padding:15px}
.card-back{
  background:none;border:none;color:#667;font-family:'Jua',sans-serif;
  font-size:.9rem;cursor:pointer;margin-top:14px;display:block;width:100%;
}
.card-back:hover{color:#9aa0ad}
</style>
</head>
<body>

<div class="deco" id="deco"></div>

<!-- ══ INTRO ══ -->
<section id="intro" class="screen on">
  <video id="intro-video" playsinline preload="auto" muted>
    <source src="assets/movie/0627%20(1)%20noah%20intro%20ver1.mp4" type="video/mp4">
  </video>
  <button class="skip" id="skip-intro">SKIP →</button>
</section>

<!-- ══ MENU ══ -->
<section id="menu" class="screen">
  <div class="badge">6학년 도덕 몰입형 체험 · [6도02-03]</div>
  <div class="title">
    <span class="t1">AI 전학생</span>
    <span class="t2">'노아'</span>
    <span class="t3">와 함께하는</span>
    <span class="t4">공존·상생 프로젝트</span>
  </div>
  <p class="subtitle">인공지능 로봇과 올바른 관계 맺기 시뮬레이터</p>
  <button class="btn btn-primary" id="go-profile">▶ 모험 시작하기</button>
  <button class="btn btn-ghost" id="replay-intro">⟲ 인트로 다시 보기</button>
  <div class="foot-note">인간과 인공지능 로봇 간의 도덕에 기반한 관계 형성</div>
</section>

<!-- ══ PROFILE (이름/성별) ══ -->
<section id="profile" class="screen">
  <div class="card">
    <div class="avatar">🤖</div>
    <div class="bubble">안녕! 만나서 반가워.<br>먼저 네 <b>이름</b>과 <b>성별</b>을 알려줄래?</div>
    <div class="field">
      <label for="name">나의 이름</label>
      <input type="text" id="name" maxlength="10" placeholder="이름을 입력하세요 (최대 10자)" autocomplete="off">
    </div>
    <div class="field">
      <label>나의 성별</label>
      <div class="gender">
        <button type="button" class="on" data-g="남">남성 ♂</button>
        <button type="button" data-g="여">여성 ♀</button>
      </div>
    </div>
    <button class="btn btn-primary" id="start-adventure" disabled>🗺️ 월드맵으로 출발! →</button>
    <button class="card-back" id="back-menu">← 뒤로</button>
  </div>
</section>

<script>
// ── 화면 전환 ──
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

// ── 배경 데코 생성 ──
(function(){
  var wrap=document.getElementById('deco'), colors=['#7c6df0','#f07caa','#7cc5f0','#5ef0a0'];
  for(var i=0;i<18;i++){
    var s=document.createElement('span');
    var size=8+Math.random()*22;
    s.style.width=s.style.height=size+'px';
    s.style.left=Math.random()*100+'vw';
    s.style.top=Math.random()*100+'vh';
    s.style.background=colors[i%colors.length];
    s.style.animationDuration=(6+Math.random()*8)+'s';
    s.style.animationDelay=(-Math.random()*8)+'s';
    wrap.appendChild(s);
  }
})();

// ── 인트로 영상 ──
var video=document.getElementById('intro-video');
video.play().catch(function(){}); // 자동재생 실패해도 SKIP으로 진행 가능
video.addEventListener('ended', function(){ show('menu'); });
document.getElementById('skip-intro').addEventListener('click', function(){
  try{ video.pause(); }catch(e){}
  show('menu');
});

// ── 메뉴 ──
document.getElementById('go-profile').addEventListener('click', function(){
  show('profile');
  document.getElementById('name').focus();
});
document.getElementById('replay-intro').addEventListener('click', function(){
  show('intro');
  try{ video.currentTime=0; video.play(); }catch(e){}
});

// ── 프로필 입력 ──
var nameInput=document.getElementById('name');
var startBtn=document.getElementById('start-adventure');
var gender='남';

nameInput.addEventListener('input', function(){
  startBtn.disabled = nameInput.value.trim().length===0;
});
nameInput.addEventListener('keydown', function(e){
  if(e.key==='Enter' && !startBtn.disabled) startBtn.click();
});
document.querySelectorAll('.gender button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.gender button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');
    gender=b.dataset.g;
  });
});
document.getElementById('back-menu').addEventListener('click', function(){ show('menu'); });

// ── 출발 → localStorage 저장 후 월드맵으로 ──
startBtn.addEventListener('click', function(){
  var profile={ name:nameInput.value.trim(), gender:gender };
  try{ localStorage.setItem('noah_profile', JSON.stringify(profile)); }catch(e){}
  window.location.href='worldmap.html';
});

// 저장된 프로필이 있으면 프리필
try{
  var saved=JSON.parse(localStorage.getItem('noah_profile')||'null');
  if(saved){
    if(saved.name){ nameInput.value=saved.name; startBtn.disabled=false; }
    if(saved.gender){
      gender=saved.gender;
      document.querySelectorAll('.gender button').forEach(function(b){
        b.classList.toggle('on', b.dataset.g===saved.gender);
      });
    }
  }
}catch(e){}
</script>
</body>
</html>
